name: Test

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run tests
              run: npm test
